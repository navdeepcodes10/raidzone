<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:radial-gradient(ellipse at 50% 50%, #1a0500, #000); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.big { color:#FF6B00; font-family:'Helvetica Neue',system-ui,sans-serif; font-weight:900; font-size:140px; line-height:0.95; text-align:center; letter-spacing:-4px; text-shadow: 0 0 80px #FF6B0044, 0 4px 0 rgba(0,0,0,0.5); }
.sub { color:rgba(255,255,255,0.6); font-family:system-ui; font-weight:600; font-size:36px; margin-top:30px; text-align:center; }
.vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%); pointer-events:none; }
</style></head><body>
<div class="vignette"></div>
<div class="big">RAID<br>ZONE</div>
<div class="sub">India's Kabaddi Discovery Hub</div>
</body></html>
