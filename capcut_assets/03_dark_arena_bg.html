<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background: radial-gradient(ellipse at 50% 30%, #1a0800 0%, #0a0400 40%, #000000 100%); overflow:hidden; }

/* Dust particles */
.particle {
  position:absolute;
  background:#ffd700;
  border-radius:50%;
  filter:blur(1px);
  box-shadow: 0 0 4px #ffa500;
  opacity:0.6;
}

/* Ground texture line */
.ground-line {
  position:absolute;
  bottom:0; left:0; right:0;
  height:400px;
  background: linear-gradient(180deg, transparent 0%, rgba(139,69,19,0.1) 50%, rgba(139,69,19,0.2) 100%);
}

/* Stadium light beams */
.light-beam {
  position:absolute;
  top:0;
  width:200px;
  height:100%;
  background: linear-gradient(180deg, rgba(255,200,100,0.08) 0%, transparent 60%);
  transform-origin: top center;
}
.light-beam:nth-child(1) { left:100px; transform:skewX(-15deg); }
.light-beam:nth-child(2) { right:100px; transform:skewX(15deg); }
.light-beam:nth-child(3) { left:50%; margin-left:-100px; opacity:0.5; }

/* Vignette */
.vignette {
  position:absolute;
  inset:0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
}
</style></head><body>
<div class="light-beam"></div>
<div class="light-beam"></div>
<div class="light-beam"></div>
<div class="ground-line"></div>

<!-- Scattered dust particles -->
<div class="particle" style="top:15%;left:20%;width:3px;height:3px;"></div>
<div class="particle" style="top:25%;left:70%;width:4px;height:4px;"></div>
<div class="particle" style="top:35%;left:40%;width:2px;height:2px;"></div>
<div class="particle" style="top:45%;left:80%;width:5px;height:5px;"></div>
<div class="particle" style="top:55%;left:15%;width:3px;height:3px;"></div>
<div class="particle" style="top:65%;left:55%;width:4px;height:4px;"></div>
<div class="particle" style="top:75%;left:30%;width:2px;height:2px;"></div>
<div class="particle" style="top:20%;left:85%;width:3px;height:3px;"></div>
<div class="particle" style="top:40%;left:10%;width:4px;height:4px;opacity:0.4;"></div>
<div class="particle" style="top:60%;left:65%;width:3px;height:3px;opacity:0.5;"></div>
<div class="particle" style="top:80%;left:45%;width:5px;height:5px;opacity:0.3;"></div>
<div class="particle" style="top:10%;left:50%;width:2px;height:2px;opacity:0.7;"></div>

<div class="vignette"></div>
</body></html>
