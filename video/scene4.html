<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 4 - Grand Brand Climax</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0d0e11;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 100px 70px;
    }

    .shockwave-gold {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1100px;
      height: 1100px;
      background: radial-gradient(circle, rgba(255, 201, 60, 0.22) 0%, rgba(255, 201, 60, 0.05) 50%, transparent 70%);
      filter: blur(90px);
      pointer-events: none;
    }

    .brand-logo-frame {
      width: 200px;
      height: 200px;
      border-radius: 46px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 80px rgba(255, 201, 60, 0.4);
      border: 3px solid rgba(255, 201, 60, 0.5);
      margin-bottom: 36px;
      z-index: 10;
    }

    .brand-title {
      font-size: 5.8rem;
      font-weight: 900;
      letter-spacing: 0.03em;
      line-height: 1;
      color: #ffffff;
      margin-bottom: 12px;
      z-index: 10;
    }

    .brand-tagline {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: #ffc93c;
      text-transform: uppercase;
      margin-bottom: 40px;
      z-index: 10;
    }

    .cta-big-card {
      background: linear-gradient(135deg, #ffc93c 0%, #f5b922 100%);
      border-radius: 40px;
      padding: 50px 60px;
      width: 100%;
      max-width: 920px;
      box-shadow: 0 30px 80px rgba(255, 201, 60, 0.4);
      z-index: 10;
    }

    .cta-card-heading {
      font-size: 3.4rem;
      font-weight: 900;
      color: #121316;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .cta-card-sub {
      font-size: 1.45rem;
      font-weight: 700;
      color: rgba(18, 19, 22, 0.85);
      margin-bottom: 34px;
    }

    .cta-button {
      background: #121316;
      color: #ffc93c;
      font-size: 2rem;
      font-weight: 900;
      padding: 24px 64px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }

    .footer-handles {
      margin-top: 50px;
      z-index: 10;
    }
    .footer-url {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .footer-insta {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffc93c;
    }
  </style>
</head>
<body>
  <div class="shockwave-gold"></div>

  <img src="/Users/navdeep/raidzone-website/assets/logo.png" class="brand-logo-frame">
  <div class="brand-title">RAID ZONE</div>
  <div class="brand-tagline">India's Kabaddi Platform</div>

  <div class="cta-big-card">
    <div class="cta-card-heading">INSTALL FREE TODAY</div>
    <div class="cta-card-sub">100% Free • No Sign-in Required to Browse</div>
    <div class="cta-button">
      <span>TAP LINK IN BIO</span>
      <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42 5.43 5.43H5v2.44z"/></svg>
    </div>
  </div>

  <div class="footer-handles">
    <div class="footer-url">navdeepcodes10.github.io/raidzone</div>
    <div class="footer-insta">Instagram: @raidzonekabaddi</div>
  </div>
</body>
</html>
