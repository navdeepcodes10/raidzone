<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 2 - The Statement</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0d0e10;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 100px 80px;
    }

    .ambient-burst {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1000px;
      height: 1000px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.12) 0%, rgba(255, 201, 60, 0.08) 40%, transparent 70%);
      filter: blur(100px);
      pointer-events: none;
    }

    .strike-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      padding: 14px 34px;
      border-radius: 9999px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #9ba1a6;
      margin-bottom: 50px;
    }

    .statement-huge {
      font-size: 5.6rem;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .statement-huge span.strike {
      color: #6b7280;
      text-decoration: line-through;
      text-decoration-color: #ef4444;
      text-decoration-thickness: 6px;
    }
    .statement-huge span.gold {
      background: linear-gradient(135deg, #ffc93c 10%, #f5b922 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
      margin-top: 20px;
      font-size: 6.4rem;
    }

    .sub-statement {
      font-size: 1.8rem;
      font-weight: 700;
      color: #d9dadc;
      max-width: 820px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="ambient-burst"></div>

  <div class="strike-pill">THE GAME HAS CHANGED</div>

  <div class="statement-huge">
    <span class="strike">NO MORE FAKE POSTERS.</span><br>
    <span class="strike">NO MISSED MATCHES.</span>
    <span class="gold">EVERY TOURNAMENT. ONE APP.</span>
  </div>

  <p class="sub-statement">
    Circle Style & National Championships across India — certified schedules, verified cash prizes & live venue streams.
  </p>
</body>
</html>
