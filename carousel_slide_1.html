<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide 1 - Raid Zone Official Launch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1350px;
      background: #1e2024;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 60px 48px;
    }

    .glow-top {
      position: absolute;
      top: -140px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 201, 60, 0.18) 0%, rgba(56, 189, 248, 0.08) 50%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    /* Top Brand Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .brand-name {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .brand-tag {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #ffc93c;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .badge-slide {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #d9dadc;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 9999px;
      letter-spacing: 0.06em;
    }

    /* Hero Raider Artwork Container */
    .hero-art-container {
      position: relative;
      width: 100%;
      height: 540px;
      border-radius: 32px;
      overflow: hidden;
      border: 2px solid rgba(255, 201, 60, 0.35);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      z-index: 10;
    }
    .hero-art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }
    .hero-art-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20, 21, 24, 0.92) 0%, rgba(20, 21, 24, 0.25) 50%, transparent 100%);
    }
    .hero-art-pill {
      position: absolute;
      bottom: 24px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pill-left {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pill-right {
      background: #ffc93c;
      color: #121316;
      font-size: 0.95rem;
      font-weight: 900;
      padding: 10px 24px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }

    /* Headline Area */
    .copy-block {
      text-align: center;
      z-index: 10;
      margin: 10px 0;
    }
    .tag-pill-gold {
      display: inline-block;
      background: rgba(255, 201, 60, 0.16);
      border: 1.5px solid #ffc93c;
      color: #ffc93c;
      font-size: 0.92rem;
      font-weight: 800;
      padding: 8px 22px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }
    .main-title {
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .main-title span {
      background: linear-gradient(135deg, #ffc93c 20%, #f5b922 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .lead-text {
      font-size: 1.35rem;
      color: #d9dadc;
      font-weight: 600;
      margin-top: 14px;
      line-height: 1.5;
    }

    /* Bottom Carousel Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      z-index: 10;
    }
    .dots-indicator {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }
    .dot.active {
      width: 38px;
      height: 12px;
      border-radius: 9999px;
      background: #ffc93c;
      box-shadow: 0 0 14px rgba(255, 201, 60, 0.5);
    }
    .swipe-prompt {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 900;
      color: #ffc93c;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="glow-top"></div>

  <!-- Top Brand Row -->
  <div class="top-bar">
    <div class="brand-wrap">
      <img src="assets/logo.png" alt="Raid Zone" class="brand-logo">
      <div>
        <div class="brand-name">RAID ZONE</div>
        <div class="brand-tag">Kabaddi Tournament Discovery</div>
      </div>
    </div>
    <div class="badge-slide">Slide 01 / 03</div>
  </div>

  <!-- Hero Cinematic Raider Action Poster -->
  <div class="hero-art-container">
    <img src="assets/kabaddi_hero.jpg" alt="Kabaddi Raider in Action" class="hero-art-img">
    <div class="hero-art-gradient"></div>
    <div class="hero-art-pill">
      <div class="pill-left">
        <svg width="20" height="20" fill="#10b981" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
        <span>100% Verified Sports Committees</span>
      </div>
      <div class="pill-right">CIRCLE & NATIONAL</div>
    </div>
  </div>

  <!-- Main Headline Block -->
  <div class="copy-block">
    <span class="tag-pill-gold">⚡ OFFICIAL APP LAUNCH</span>
    <h1 class="main-title">
      Ab Har Tournament<br>
      Aapke <span>Phone Par!</span>
    </h1>
    <p class="lead-text">
      Find every tournament schedule, weight class, cash prize, and live stream across India in one clean app.
    </p>
  </div>

  <!-- Bottom Carousel Navigation -->
  <div class="bottom-bar">
    <div class="dots-indicator">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="swipe-prompt">
      <span>Swipe to see features</span>
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42 5.43 5.43H5v2.44z"/></svg>
    </div>
  </div>

</body>
</html>
